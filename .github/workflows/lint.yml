name: CI
on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]
jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install modules
              run: bun install
            - name: Run Biome
              run: bun biome ci
            - name: Run TSC
              run: bun tsc --noEmit

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: dev-backend
        environment:
            - NODE_ENV=production
        ports:
            - '4000:4000'
        volumes:
            - ./.env.local:/usr/src/app/.env.local
        networks:
            - app-network
        extra_hosts:
            - 'host.docker.internal:host-gateway'

networks:
    app-network:
        driver: bridge
